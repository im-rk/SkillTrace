# Reverse proxy in front of the backend, used locally (via docker-compose.prod.yml) to
# verify a proxy passes WebSocket upgrades through correctly before trusting a real host's
# proxy layer with it -- the exact class of bug Phase 14 calls out as invisible until
# specifically tested. The app's own routes are all at root (no /api prefix), so this
# proxies everything through unchanged; it does not also front the frontend; in real
# deployment the frontend and backend are on separate hosts anyway (see docs/adr/0013).
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # WebSocket upgrade: Connection is "upgrade" only when the client actually asked for
    # one; otherwise a plain "close", so ordinary HTTP requests are unaffected.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # A dropped exam session must be noticed via the app's own heartbeat/stale
            # threshold, not silently killed early by the proxy's idle timeout.
            proxy_read_timeout 3600s;
        }
    }
}
